name: Publish

# Releases are cut from `skills-v*` tags only.
#
# There is no branch trigger: under the rebase fork model (docs/fork-strategy.md)
# `main` is force-pushed on every upstream sync, so a branch trigger would fire on
# each one. The tag pattern is `skills-v*` rather than `v*` because upstream's 41
# `v1.x` tags are ancestors of our history and share that namespace.
on:
  push:
    tags:
      - 'skills-v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Determine version bump type
        id: version
        run: |
          # If tag push, skip version bump (already versioned)
          if [[ "${{ github.ref }}" == refs/tags/skills-v* ]]; then
            echo "bump=skip" >> $GITHUB_OUTPUT
            echo "Tag push - skipping version bump, will publish directly"
            exit 0
          fi

          # If manually triggered, use the input value
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump=${{ inputs.bump }}" >> $GITHUB_OUTPUT
            echo "Manual trigger - will bump ${{ inputs.bump }} version"
            exit 0
          fi

          # Unreachable: the only triggers are a skills-v* tag push and
          # workflow_dispatch, both handled above. The previous commit-marker scan
          # ([patch]/[minor]) lived here for the removed `release` branch trigger;
          # it is gone because on this fork it would have scanned all of upstream's
          # history for those markers and matched their commits, not ours.
          echo "bump=none" >> $GITHUB_OUTPUT
          echo "Unrecognized trigger - not releasing"

      - name: Configure git
        if: steps.version.outputs.bump != 'none' && steps.version.outputs.bump != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: steps.version.outputs.bump != 'none' && steps.version.outputs.bump != 'skip'
        run: |
          npm version ${{ steps.version.outputs.bump }} -m "v%s"

      - name: Push changes
        if: steps.version.outputs.bump != 'none' && steps.version.outputs.bump != 'skip'
        run: |
          git push
          git push --tags

      - name: Publish to npm
        id: publish
        if: steps.version.outputs.bump != 'none'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.publish.outcome == 'success'
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Changelog comes from git log, not `gh pr list`: this fork rebases its
          # patch onto upstream and merges no PRs of its own, so a PR-based
          # changelog is always empty. --match keeps upstream's v1.x tags out.
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'skills-v*' HEAD^ 2>/dev/null || echo "")

          if [ -n "$LATEST_TAG" ]; then
            CHANGELOG=$(git log "${LATEST_TAG}..HEAD" --format='- %s' --no-merges)
          elif git rev-parse --verify -q origin/upstream-main >/dev/null; then
            # No release tag on this history line. Happens on the first release
            # after an upstream realign, which rewrites main and orphans older
            # tags. Describe our patch (what this fork adds) rather than walking
            # into upstream's history and reporting their commits as ours.
            CHANGELOG=$(git log origin/upstream-main..HEAD --format='- %s' --no-merges)
          else
            CHANGELOG=$(git log -1 --format='- %s')
          fi

          [ -z "$CHANGELOG" ] && CHANGELOG="- No changes recorded since ${LATEST_TAG:-the last upstream realign}"

          # Generate release notes from template
          export VERSION CHANGELOG
          envsubst < .github/RELEASE_TEMPLATE.md > release-notes.md

          gh release create "skills-v${VERSION}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
